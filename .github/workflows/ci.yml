name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Node tests
        run: npm test

      - name: Static check
        run: npm run static-check

      - name: Marketing launch audit
        run: npm run marketing:audit

      - name: Build
        run: npm run build

  rust:
    runs-on: windows-2022
    env:
      RUST_TEST_THREADS: '4'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CMake 3.31 and resolve test Python
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check cmake==3.31.6
          if ($LASTEXITCODE -ne 0) { throw 'CMake installation failed' }
          $cmakeBin = python -c "import cmake; print(cmake.CMAKE_BIN_DIR)"
          if ($LASTEXITCODE -ne 0) { throw 'CMake discovery failed' }
          $cmakeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $pythonExe = python -I -c "import os,sys; print(os.path.realpath(sys.executable))"
          if ($LASTEXITCODE -ne 0) { throw 'Python discovery failed' }
          & $pythonExe -I -c "import pathlib,sys; p=pathlib.Path(sys.executable); assert p.is_absolute() and p.is_file(); assert not any(x.lstat().st_file_attributes & 0x400 for x in [p,*p.parents])"
          if ($LASTEXITCODE -ne 0) { throw 'Python path contains reparse points' }
          "FUSION_TEST_PYTHON=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Rust format check
        run: npm run rust:fmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # tauri::generate_context! embeds ../out into the binary at compile
      # time, so the frontend export must exist before any cargo build step.
      - name: Build frontend export
        run: npm run build

      - name: Clippy
        run: npm run rust:clippy

      - name: Rust tests
        run: npm run rust:test
